#define V vec3
// fake rotation matrix (not orthonormal, just enough shear to break symmetry

// ported from; the 11/33 offsets are its magic, not ours

const float E=0.001;
const int STEPS=80;

// when the audio repeats. 768/24 = 32 beats/loop too -- re-derive both this
// and pulse()'s divisor from song.js together whenever the track changes.
const float TICKS_PER_LOOP=768.0;

void rot(inout vec2 p, float a){

}

float box(V position, V dimensions){

}

vec2 opU(vec2 d1, vec2 d2){

// divisor from song.js whenever the track changes -- it's not derivable from

float pulse(){

vec2 scene(V p){

    float lp=fract(T.y/TICKS_PER_LOOP);   // 0->1 once per song loop, exactly

    // three small cubes orbiting a common center, hovering at a fixed

        V pi=rel-V(cos(ang),sin(ang),0.0)*.3;

        res=opU(res,vec2(box(pi,V(.2*pl)),fi+1.0));
    }
    return res;
}

V calcNormal(V pos){
    vec2 e=vec2(0.001,0.0);
    return normalize(V(scene(pos+e.xyy).x-scene(pos-e.xyy).x,
                        scene(pos+e.yxy).x-scene(pos-e.yxy).x,
                        scene(pos+e.yyx).x-scene(pos-e.yyx).x));

// returns vec2(distance,id) and writes the hit position; no struct, because
// Shader Minifier 1.5.1 will reuse a struct's type name for a local variable
vec2 march(V ro, V rd, out V pos){

    float id=0.0;
    pos=ro;
    for(int i=0;i<STEPS;i++){
        vec2 d=scene(pos);
        t+=d.x;
        id=d.y;
        pos=ro+rd*t;
        if(d.x<E||t>FAR) break;
    }
    return vec2(t,id);
}

void main(){

    vec2 hit=march(V(0.0),rd,hitPos);

    // "happy accident" (layered sine ripples folded through a fake rotation
    // matrix, tonemapped through tanh); made it ours by wiring the fractal
    // fold, the tunnel path, and the color cycling all to the birb beat
    // pulse, and by locking its forward scroll to the song's loop length
    // instead of raw seconds so it closes cleanly when the audio repeats.

        else if(hit.y<2.5) col=V(.2,.2,1.0)*diff;
        else col=V(.95,.6,.2)*diff;
    }

    FragColor=vec4(col,1.0);
}//*--`)
