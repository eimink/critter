// 192 ticks = exactly 8 beats, so the build-up below resets with the music.
// Re-derive from song.js if the track changes.
const float TPB=24.0;
const float BEATS=8.0;
const int STEPS=96;
const float FAR=100.0;
const float STRIDE=2.0;    // beats per full leg cycle (a bar) -- keeps the gait
                           // near the original 1.6s cadence at 180bpm
const float TAU=6.2831853;
const float TPL=TPB*BEATS;   // 192 ticks = one full song loop
const float CAMLOOPS=2.0;    // hold each camera for two loops
const int NCAM=12;

// Shot list. Flock at full build-up spans x -30..1.9, z +-22, so wide shots aim
// at its middle (x=-14). 12 shots x 2 loops = 63.9s, loop-locked to the music.
//  0 pulled back from the original start   6  near-orthographic from ahead
//  1 wide, all rows in frame               7  wide, mirrored
//  2 top-down                              8  high, from behind
//  3 close-up on the lead duck's face      9  near-orthographic from behind
//  4 close-up on the marching feet        10  low front
//  5 far behind, whole flock              11  high three-quarter
const V CAMS[12]=V[12](
    V(4.5,3.,4.5),   V(20.,13.,28.),  V(-6.,46.,0.),
    V(3.4,1.2,1.1),  V(2.4,-.7,1.5),  V(-64.,14.,0.),
    V(52.,6.,0.),    V(20.,13.,-28.), V(-58.,30.,-18.),
    V(-80.,10.,0.),  V(5.,.8,5.),     V(24.,34.,26.)
);
const V CAMT[12]=V[12](
    V(0.),           V(-14.,0.,0.),   V(-14.,0.,0.),
    V(1.3,.8,0.),    V(.2,-1.25,0.),  V(-14.,0.,0.),
    V(-14.,0.,0.),   V(-14.,0.,0.),   V(-14.,0.,0.),
    V(-14.,0.,0.),   V(0.,.2,0.),     V(-14.,0.,0.)
);

// haze: geometry fades into it instead of cutting to black at the far plane
const V FOG=V(.06,.07,.1);
const float FOGN=65.0;    // starts here, complete at FAR

// city
const float GY=-1.5;      // ground level, at the ducks' feet
const float CGRID=14.0;   // block spacing along the direction of travel
const float CLANE=34.0;   // |z| of the two building lanes (flock reaches +-23)
const float CSPEED=2.0;   // world units per beat the city streams past

// flock spacing
const float SPX=4.0;       // between rows, back along -x
const float SPZ=3.0;       // between ducks across a row

// duck tuning
const float LLEN=.4;
const float LSPREAD=.4;
const float WSTRIDE=.2;

// set once per pixel in main(), read by sdf()
float NX, WALK, SCROLL;

float sdBox(V p, V b){
    V q=abs(p)-b;
    return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);
}

void rot(inout vec2 p, float a){
    p=cos(a)*p+sin(a)*vec2(p.y,-p.x);
}

vec2 opU(vec2 d1, vec2 d2){
    return d1.x<d2.x?d1:d2;
}

// Two rows of blocks flanking the corridor, streaming past to sell the motion.
// Mirroring in z and repeating in x are both exact, so unlike a masked grid this
// stays a real distance field -- no leaking.
float city(V p){
    float lane=sign(p.z);
    float z=abs(p.z)-CLANE;
    p.x+=SCROLL;
    float ix=floor(p.x/CGRID+.5);
    p.x-=ix*CGRID;
    float h=7.+fract(sin(ix*91.7+lane*13.3)*3e4)*22.;
    return sdBox(V(p.x,p.y-(GY+h*.5),z),V(4.,h*.5,4.));
}

// one duck, at the origin
vec2 one(V p){
    V pp=p;

    pp=pp-V(1.+sin(WALK*2.)*.02,.7,0.);
    float head=sdBox(pp,V(.5,.4,.5));
    V ppp=pp-V(.7,-.1,0.);
    float beak=sdBox(ppp,V(.2,.08,.2));
    pp.z=abs(pp.z);
    pp=pp-V(.5,.2,.3);
    float eyes=sdBox(pp,V(.1,.1,.1));

    vec2 h=opU(vec2(eyes,1.),opU(vec2(beak,2.),vec2(head,3.)));

    pp=p;
    rot(pp.xz,-sin(WALK)*.1);
    float body=sdBox(pp,V(1.,.6,.8));
    pp=pp-V(-1.1+sin(WALK*2.)*.02,.7,0.);
    rot(pp.xz,sin(WALK)*.1);
    float tail=sdBox(pp,V(.4,.1,.6));
    body=min(tail,body);
    vec2 b=opU(vec2(body,3.),h);

    pp=p;
    rot(pp.xy,sin(WALK)*WSTRIDE);
    pp=pp-V(0.,-1.,LSPREAD);
    float lleg=sdBox(pp,V(.1,LLEN,.2));
    lleg=min(lleg,sdBox(pp-V(.2,-LLEN,0.),V(.4,.1,.2)));

    pp=p;
    rot(pp.xy,-sin(WALK)*WSTRIDE);
    pp=pp-V(0.,-1.,-LSPREAD);
    float rleg=sdBox(pp,V(.1,LLEN,.2));
    rleg=min(rleg,sdBox(pp-V(.2,-LLEN,0.),V(.4,.1,.2)));
    float legs=min(lleg,rleg);

    return opU(vec2(legs,2.),b);
}

vec2 sdf(V p){
    // Evaluate the two cells straddling p on each axis, not just the nearest.
    // Ducks are 3.4 long in a 4-unit cell, so folding to one cell overestimates
    // the distance to a neighbour by up to 25x near the surface and rays step
    // clean through it.
    vec2 d=vec2(1e5,0.);
    for(int i=0;i<2;i++){
        float rx=clamp(floor(p.x/SPX)+float(i),-NX,0.);
        float nz=-rx;
        V q=p; q.x-=rx*SPX;
        for(int j=0;j<2;j++){
            float jz=clamp(floor(q.z/SPZ)+float(j),-nz,nz);
            V u=q; u.z-=jz*SPZ;
            d=opU(d,one(u));
        }
    }
    return opU(opU(vec2(p.y-GY,4.),vec2(city(p),5.)),d);
}

// returns vec4(hit position, id). No struct: Shader Minifier 1.5.1 reuses a
// struct's type name for a local variable and emits a shader that won't compile.
vec4 march(V ro, V rd, inout float t){
    V p=ro+rd;
    float id=0.;
    for(int i=0;i<STEPS;i++){
        vec2 d=sdf(p);
        // understep: clamped domain repetition can report a distance larger than
        // the true nearest duck, so a full step grazes/leaks through neighbours
        float s=d.x*.85;
        t+=s;
        p+=rd*s;
        id=d.y;
        if(d.x<.008||t>FAR) break;
    }
    return vec4(p,id);
}

V color(float id, V p, V n){
    if(id==1.) return V(.1);
    else if(id==2.) return V(.8,.3,.2);
    else if(id==3.) return V(.8,.7,.4);
    else if(id==4.) return V(.22);
    else if(id==5.){
        // repeat the along-wall coordinate to get a window grid. pick x or z by
        // which face we hit so the grid runs across the wall, not along it.
        vec2 uv=vec2(abs(n.z)>.5?p.x+SCROLL:p.z,p.y-GY)/vec2(2.,2.8);
        vec2 f=fract(uv);
        float pane=step(.2,f.x)*step(f.x,.8)*step(.25,f.y)*step(f.y,.8);
        float lit=step(.62,fract(sin(dot(floor(uv),vec2(19.3,7.7)))*4e4));
        return mix(V(.38,.37,.35),lit>.5?V(1.,.9,.6):V(.05,.06,.09),pane);
    }
    return V(0);
}

V calcNormal(V pos){
    vec2 e=vec2(.00001,0.);
    return normalize(V(sdf(pos+e.xyy).x-sdf(pos-e.xyy).x,
                       sdf(pos+e.yxy).x-sdf(pos-e.yxy).x,
                       sdf(pos+e.yyx).x-sdf(pos-e.yyx).x));
}

void main(){
    // beat 0: one duck. beat 1: a row of three. from beat 2 a further row
    // falls in behind on every beat, through beat 7, then the loop restarts.
    float stage=mod(floor(T.y/TPB),BEATS);
    NX=stage;   // one more row falls in behind on every beat; each is 2 wider
    WALK=T.y/(TPB*STRIDE)*TAU;
    SCROLL=T.y*CSPEED/TPB*CGRID;

    int ci=int(mod(floor(T.y/TPL/CAMLOOPS),float(NCAM)));
    V cp=CAMS[ci];
    V ct=CAMT[ci];
    // focal length: bigger = narrower. 7 and 13 are the near-orthographic pair.
    float fov=(ci==6||ci==9)?4.:1.5708;
    V ld=V(-2.,.5,2.);

    vec2 q=-1.+2.*(gl_FragCoord.xy/R);
    q.x*=R.x/R.y;

    V cf=normalize(ct-cp);
    V cr=normalize(cross(V(0.,1.,0.),cf));
    V cu=normalize(cross(cf,cr));

    V rd=normalize(mat3(cr,cu,cf)*V(q,fov));

    float t=0.;
    vec4 m=march(cp,rd,t);

    V col=FOG;
    if(t<FAR){
        V n=calcNormal(m.xyz);
        col=color(m.w,m.xyz,n)+clamp(dot(n,ld),0.,1.)*.1;
    }
    col=mix(col,FOG,smoothstep(FOGN,FAR,t));

    FragColor=vec4(col,1.);
}
