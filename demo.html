<body onclick="A||I()"><p id=C>click</p><canvas id=c></canvas><script src="song.js"></script><script>

precision highp float;
#define V vec3

uniform vec2 T;   // T.x = seconds since start, T.y = birb tick
uniform vec2 R;   // resolution

const float E=0.001;
const int STEPS=64;
const float FAR=40.0;

V glow=V(0.0);

// caller passes cos/sin: the per-step angle is constant for the whole frame
void rot(inout vec2 p, float ca, float sa){
    p=ca*p+sa*vec2(p.y,-p.x);
}

float box(V position, V dimensions){
    V b=abs(position)-dimensions;
    return length(max(b,0.0))+min(max(b.x,max(b.y,b.z)),0.0);
}

vec2 opU(vec2 d1, vec2 d2){
    return (d1.x<d2.x) ? d1 : d2;
}

vec2 scene(V p){
    float fGlobalTime=T.x;
    V pp=p, ppp=p;
    vec2 res=vec2(1.,0.), res2=vec2(1.,0.), res3=vec2(1.,0.);
    float ca=cos(fGlobalTime*0.01), sa=sin(fGlobalTime*0.01);
    for(int ii=0;ii<16;ii++){
        float i=float(ii);
        // all nine boxes reuse only these four trig values
        float cp=cos(fGlobalTime+i), sp=sin(fGlobalTime+i);
        float cm=cos(fGlobalTime-i), sm=sin(fGlobalTime-i);

        rot(pp.xz,ca,sa);
        rot(pp.zy,ca,sa);
        float a=box(pp+V(cp,sm,15.0-i),V(1.0));
        float b=box(pp+V(1.+sp,1.+sm,14.0-i),V(1.0));
        float c=box(pp+V(2.+cp,2.+cm,13.0-i),V(1.0));
        res=opU(res,vec2(min(a,min(b,c)),1.));

        rot(ppp.zy,ca,sa);
        rot(ppp.zx,ca,sa);
        float d=box(ppp+V(cp,6.+sm,12.0-i),V(1.0));
        float e=box(ppp+V(1.+sp,7.+sm,11.0-i),V(1.0));
        float f=box(ppp+V(2.+cp,8.+cm,10.0-i),V(1.0));
        res2=opU(res2,vec2(min(d,min(e,f)),2.));

        rot(p.zy,ca,sa);
        rot(p.xz,ca,sa);
        float g=box(p+V(cp,12.+sm,9.0-i),V(1.0));
        float hh=box(p+V(1.+sp,13.+sm,8.0-i),V(1.0));
        float j=box(p+V(2.+cp,14.+cm,7.0-i),V(1.0));
        res3=opU(res3,vec2(min(g,min(hh,j)),3.));
    }
    // beat pulse from the tick counter brightens the near ring on top of the shadertoy glow term
    float pulse=exp(-fract(T.y*.25)*4.);
    glow+=V(.85,.08,.45)*(0.0012+pulse*.002)/abs(res.x)+0.0001;
    glow+=V(.02,.08,.45)*0.005/abs(res2.x)+0.001;
    glow+=V(.4,.08,.4)*0.002/abs(res3.x)+0.0001;
    return opU(res3,opU(res2,res));
}

V calcNormal(V pos){
    vec2 e=vec2(0.00001,0.0);
    return normalize(V(scene(pos+e.xyy).x-scene(pos-e.xyy).x,
                        scene(pos+e.yxy).x-scene(pos-e.yxy).x,
                        scene(pos+e.yyx).x-scene(pos-e.yyx).x));
}

// returns vec2(distance,id) and writes the hit position; no struct, because
// Shader Minifier 1.5.1 will reuse a struct's type name for a local variable
vec2 march(V ro, V rd, out V pos){
    float t=E;
    float id=0.0;
    pos=ro;
    for(int i=0;i<STEPS;i++){
        vec2 d=scene(pos);
        t+=d.x;
        id=d.y;
        pos=ro+rd*t;
        if(d.x<E||t>FAR) break;
    }
    return vec2(t,id);
}

V colorize(float id, V nrm, V ld){
    V col=V(0.0);
    if(id==1.0) col=V(1.0,.2,.8)+clamp(dot(nrm,ld),0.0,1.0);
    else if(id==2.0) col=V(0.2,0.2,1.0)+clamp(dot(nrm,ld),0.0,1.0);
    else if(id==3.0) col=V(0.4,0.1,0.4)+clamp(dot(nrm,ld),0.0,.5);
    return col;
}

void main(){
    float fGlobalTime=T.x;
    vec2 uv=gl_FragCoord.xy/R;
    vec2 uvv=-1.0+2.0*uv;
    uvv.x*=R.x/R.y;

    V rayOrigin=V(sin(fGlobalTime*.5)*10.,sin(fGlobalTime*2.)*2.-5.0,cos(fGlobalTime*.5)*20.-10.0);

    V z=normalize(lookAt-rayOrigin);
    V x=normalize(cross(z,V(0.0,1.0,0.0)));
    V y=normalize(cross(x,z));

    V rayDirection=normalize(mat3(x,y,z)*V(uvv,radians(60.00)));
    V lightDirection=-rayDirection;

    V col=V(0.0);
    V hitPos;
    vec2 hit=march(rayOrigin,rayDirection,hitPos);
    if(hit.x<FAR) col=colorize(hit.y,calcNormal(hitPos),lightDirection);

    col=col+glow*0.01;
    col=smoothstep(0.0,1.0,col);
    gl_FragColor=vec4(col,1.);
}//*--`)
